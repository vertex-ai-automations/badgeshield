[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "badgeshield" 
description = "Generate customizable SVG badges for any project — offline, no network calls"

readme = "README.md"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Documentation",
    "Typing :: Typed",
]
requires-python = ">=3.8"
keywords = ["badges", "svg", "ci", "shields", "badge-generator"]

dynamic = ["version", "dependencies"]

[project.optional-dependencies]
image = ["Pillow>=9.0"]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.21",
    "Pillow>=9.0",
]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.21",
    "Pillow>=9.0",
]
docs = [
    "zensical>=0.0.39",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
homepage = "https://github.com/ihassan8"
documentation = "https://ihassan8.github.io/badgeshield"
repository = 'https://github.com/ihassan8/badgeshield'
issues = "https://github.com/ihassan8/badgeshield/issues/new"

[project.scripts]
badgeshield = "badgeshield.generate_badge_cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
# Auto generate _version.py with the corresponding git tag
version_file = "src/badgeshield/_version.py"

[tool.setuptools.package-data]
badgeshield = ["fonts/*.ttf", "templates/*.svg", "templates/frames/*.png"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
