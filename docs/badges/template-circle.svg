
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" aria-labelledby="title desc" role="img">
  <!-- Accessibility: Title and description -->
  <title id="title">v1.0</title>
  <desc id="desc">A circular badge with centered text and an optional logo.</desc>

  <!-- Definition for the clipping path -->
  <defs>
    <!-- Circular clipping path for the logo -->
    <clipPath id="clipCircle">
      <circle cx="50" cy="50" r="45" />
    </clipPath>
  </defs>

  <!-- Main circle -->
  <circle cx="50" cy="50" r="45"
    fill="#673ab7"
 />

  <!-- Optional logo, scaled and clipped to fit inside the circle -->

  <!-- Centered text within the circle, dynamically sized -->
  <text x="50" y="55" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="35" fill="#ffffff" text-anchor="middle" alignment-baseline="middle">
    v1.0
  </text>

  <!-- Optional transparent clickable area covering the circle -->
</svg>
