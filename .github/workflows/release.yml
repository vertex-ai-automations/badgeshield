# ==============================================================================
# 🚢 Release Workflow
# ==============================================================================
#
# TRIGGERS & JOB MATRIX:
#
#   Event            │ docs │ publish
#   ─────────────────┼──────┼────────
#   Push to main     │  ✅  │   ⛔
#   Push tag X.X.X   │  ⛔  │   ✅
#   Manual dispatch  │  ✅  │   ⛔
#
# RELEASE FLOW:
#   1. Merge PRs to main as normal — docs deploy automatically
#   2. When ready to release, push a bare SemVer tag:
#        git tag 1.2.1
#        git push origin 1.2.1
#   3. The publish job runs: validate → test → build → pypi
#
# PRE-REQUISITES (once per project):
#
#   1. Enable GitHub Pages:
#      Settings → Pages → Source → GitHub Actions
#
#   2. Create GitHub Environments:
#      Settings → Environments → New environment
#        - "github-pages" (docs deployment)
#        - "pypi"         (real PyPI — add Required reviewers for safety)
#
#   3. Register Trusted Publisher on pypi.org:
#      pypi.org → your project → Publishing → Add publisher
#        owner    = vertex-ai-automations
#        repo     = badgeshield
#        workflow = release.yml
#        env      = pypi
#
#      NOTE: The publish job must be INLINE (not a reusable/called workflow)
#      because PyPI OIDC Trusted Publishing does not support reusable workflows.
#      See: https://docs.pypi.org/trusted-publishers/troubleshooting/
#
# SECRETS: none required — uses GitHub OIDC (id-token: write).
# ==============================================================================

name: 🚢 Release

on:
  push:
    branches:
      - main          # Docs deploy only
    tags:
      - "*.*.*"       # Publish only — bare SemVer e.g. 1.2.1
  workflow_dispatch:  # Manual trigger — docs only

jobs:

  # ============================================================
  # 📚 Build and deploy Zensical docs to GitHub Pages
  # Runs on: push to main, manual dispatch
  # ============================================================
  docs:
    name: 📚 Deploy Docs
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and docs dependencies
        run: pip install -e . -r docs/requirements.txt
      - name: Build docs
        run: zensical build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # 📦 Build, test, and publish to PyPI
  # Runs on: tag push only (X.X.X bare SemVer, no v-prefix)
  #
  # Inline job — NOT a reusable workflow — required for PyPI
  # OIDC Trusted Publishing to work correctly.
  # ============================================================
  publish:
    name: 📦 Publish Package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/badgeshield/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so setuptools_scm resolves the tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag matches SemVer X.X.X
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          python -c "
          import re, sys
          tag = '$TAG'
          if tag.startswith('v'):
              print(f'ERROR: tag {tag!r} must not start with v — use bare SemVer')
              sys.exit(1)
          if not re.fullmatch(r'\d+\.\d+\.\d+', tag):
              print(f'ERROR: tag {tag!r} does not match X.X.X')
              sys.exit(1)
          print(f'Tag {tag!r} is valid')
          "

      - name: Install package + test dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

