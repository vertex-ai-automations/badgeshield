# ==============================================================================
# 🚢 Release Workflow
# ==============================================================================
#
# TRIGGERS & JOB MATRIX:
#
#   Event            │ docs │ publish
#   ─────────────────┼──────┼────────
#   Push to main     │  ✅  │   ⛔
#   Push tag X.X.X   │  ⛔  │   ✅
#   Manual dispatch  │  ✅  │   ⛔
#
# RELEASE FLOW:
#   1. Merge PRs to main as normal — docs deploy automatically
#   2. When ready to release, push a bare SemVer tag:
#        git tag 1.2.1
#        git push origin 1.2.1
#   3. The publish job runs: validate → test → build → pypi
#
# PRE-REQUISITES (once per project):
#
#   1. Enable GitHub Pages:
#      Settings → Pages → Source → GitHub Actions
#
#   2. Create GitHub Environments:
#      Settings → Environments → New environment
#        - "github-pages" (docs deployment)
#        - "pypi"         (real PyPI — add Required reviewers for safety)
#        - "test-pypi"    (TestPyPI sandbox — no reviewers needed)
#
#   3. Register Trusted Publisher on pypi.org:
#      pypi.org → your project → Publishing → Add publisher
#        owner    = vertex-ai-automations
#        repo     = badgeshield
#        workflow = python-publish.yml
#        env      = pypi
#        (register against the shared workflow, not release.yml)
#
# SECRETS: none required — uses GitHub OIDC (id-token: write).
#   Set TEST_PYPI_API_TOKEN to enable TestPyPI validation stage.
# ==============================================================================

name: 🚢 Release

on:
  push:
    branches:
      - main          # Docs deploy only
    tags:
      - "*.*.*"       # Publish only — bare SemVer e.g. 1.2.1
  workflow_dispatch:  # Manual trigger — docs only

jobs:

  # ============================================================
  # 📚 Build and deploy Zensical docs to GitHub Pages
  # Runs on: push to main, manual dispatch
  # ============================================================
  docs:
    name: 📚 Deploy Docs
    uses: vertex-ai-automations/shared-workflows/.github/workflows/publish-zensical.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      python-version: "3.11"
      docs-requirements: "docs/requirements.txt"
      src-layout: true
    secrets: inherit

  # ============================================================
  # 📦 Build and publish to PyPI
  # Runs on: tag push only (X.X.X bare SemVer, no v-prefix)
  # ============================================================
  publish:
    name: 📦 Publish Package
    uses: vertex-ai-automations/shared-workflows/.github/workflows/python-publish.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      python-version: "3.11"
      run-tests: true
      test-command: "pytest tests/ -v --tb=short"
      publish-target: "pypi"
      use-trusted-publishing: true
    secrets: inherit
